name: 机密 / 隐私扫描

# 每次推送与 PR 都检查仓库是否混入真实凭据、IP、SSH 私钥或人脸抓图。
# 这是本仓库最重要的 CI 检查：项目由真实学生项目脱敏而来，红线不可突破。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行本地机密扫描
        run: |
          python .github/scripts/check_secrets.py

      - name: 检查不应被收录的文件
        run: |
          # 禁止出现在仓库里的扩展名 / 文件名
          BANNED='\.pem$|\.key$|\.p12$|\.pfx$|\.bin$|\.exe$|\.elf$|\.map$|\.pyc$|\.zip$|\.7z$|\.apk$|\.so$|\.jar$|\.jpg$|\.jpeg$|^\.env$'
          git ls-files -z | tr '\0' '\n' | grep -Ei "$BANNED" && {
            echo "::error::发现不应收录的文件（密钥/二进制/抓图/归档），请从提交中移除"
            exit 1
          }
          echo "✅ 未检出禁用文件"
